<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📸 PhotoGrid Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ───── HEADER ───── -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">◈</span>
        <span class="logo-text">PhotoGrid</span>
      </div>
      <p class="tagline">A curated visual journey</p>
    </div>
  </header>

  <!-- ───── FILTER BAR ───── -->
  <section class="filter-bar" aria-label="Category filters">
    <div class="filter-inner">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="nature">🌿 Nature</button>
      <button class="filter-btn" data-filter="architecture">🏛️ Architecture</button>
      <button class="filter-btn" data-filter="people">👤 People</button>
      <button class="filter-btn" data-filter="travel">✈️ Travel</button>
      <button class="filter-btn" data-filter="abstract">🎨 Abstract</button>
    </div>
  </section>

  <!-- ───── GALLERY GRID ───── -->
  <main class="gallery-container" id="gallery" aria-label="Image gallery">
    <!-- Cards injected by JS -->
  </main>

  <!-- ───── LIGHTBOX ───── -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
    <button class="lb-close" id="lbClose" aria-label="Close lightbox">&#x2715;</button>

    <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous image">&#10094;</button>

    <div class="lb-content">
      <div class="lb-img-wrap">
        <img class="lb-img" id="lbImg" src="" alt="" />
        <div class="lb-loader" id="lbLoader"></div>
      </div>
      <div class="lb-caption">
        <span class="lb-title" id="lbTitle"></span>
        <span class="lb-category" id="lbCategory"></span>
        <span class="lb-counter" id="lbCounter"></span>
      </div>
    </div>

    <button class="lb-nav lb-next" id="lbNext" aria-label="Next image">&#10095;</button>
  </div>

  <!-- ───── BACK-TO-TOP ───── -->
  <button class="back-top" id="backTop" aria-label="Back to top">↑</button>

  <footer class="site-footer">
    <p>Images via <a href="https://picsum.photos" target="_blank" rel="noopener">Lorem Picsum</a> &nbsp;·&nbsp; Built with ♥</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
